<div class="card">
    <picture>
        <source media="(min-width: 769px)" srcset="assets/images/image-product-desktop.jpg">
        <img class="image" src="assets/images/image-product-mobile.jpg" alt="">
    </picture>
    
    <section>
        <p class="category">{{category}}</p>
        <h1>{{title}}</h1>
        <p>{{description}}</p>
        <div class="prices">
            <p class="old">${{oldPrice}}</p>
            <p class="new">${{newPrice}}</p>
        </div>
        <app-button></app-button>
    </section>

</div>
